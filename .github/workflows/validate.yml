name: Validate catalogue

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Once a week: catches a source repository that has been renamed or deleted.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Manifest
        run: node scripts/valider.mjs
      - name: Source repositories reachable
        run: node scripts/valider.mjs --remote
